<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
  <title>LobsterBoard Mobile</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/builder.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="mobile-app" data-view="stream">

  <!-- ═══════════════════════════════════════════
       MOBILE HEADER
       ═══════════════════════════════════════════ -->
  <header class="mobile-header">
    <div class="mobile-header-left">
      <img src="lobsterboard-logo-final.png" alt="LobsterBoard" class="mobile-logo">
      <span class="mobile-title">LobsterBoard</span>
    </div>
    <div class="mobile-header-right">
      <button class="mobile-icon-btn" id="btn-refresh" title="Refresh">
        <span class="mobile-icon">↻</span>
      </button>
      <button class="mobile-icon-btn" id="btn-settings" title="Settings">
        <span class="mobile-icon">⚙</span>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════
       SETTINGS PANEL (slide-down drawer)
       ═══════════════════════════════════════════ -->
  <div class="mobile-settings-drawer" id="settings-drawer">
    <div class="settings-group">
      <label class="settings-label">View Mode</label>
      <div class="view-switcher">
        <button class="view-btn active" data-view="stream">Stream</button>
        <button class="view-btn" data-view="tabs">Tabs</button>
        <button class="view-btn" data-view="command">Command</button>
      </div>
    </div>
    <div class="settings-group">
      <label class="settings-label">Theme</label>
      <select id="mobile-theme-select" class="mobile-select">
        <option value="default">🌙 Dark</option>
        <option value="feminine">🌸 Feminine</option>
        <option value="feminine-dark">💜 Feminine Dark</option>
        <option value="terminal">💻 Terminal</option>
        <option value="paper">📜 Paper</option>
        <option value="void">🕳️ Void Space</option>
      </select>
    </div>
    <div class="settings-group">
      <a href="/app.html" class="settings-link">Open Desktop Builder →</a>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       VIEW: STREAM (scrollable feed)
       ═══════════════════════════════════════════ -->
  <main class="mobile-view view-stream" id="view-stream">
    <div class="stream-container" id="stream-container">
      <!-- Widgets rendered here by JS -->
    </div>
  </main>

  <!-- ═══════════════════════════════════════════
       VIEW: TABS (category swipe panels)
       ═══════════════════════════════════════════ -->
  <main class="mobile-view view-tabs" id="view-tabs" style="display:none;">
    <div class="tabs-bar" id="tabs-bar">
      <!-- Tab buttons generated by JS -->
    </div>
    <div class="tabs-panels" id="tabs-panels">
      <!-- Swipeable panels generated by JS -->
    </div>
  </main>

  <!-- ═══════════════════════════════════════════
       VIEW: COMMAND CENTER (accordion groups)
       ═══════════════════════════════════════════ -->
  <main class="mobile-view view-command" id="view-command" style="display:none;">
    <div class="command-ticker" id="command-ticker">
      <!-- Status ticker rendered by JS -->
    </div>
    <div class="command-groups" id="command-groups">
      <!-- Accordion groups rendered by JS -->
    </div>
  </main>

  <!-- ═══════════════════════════════════════════
       BOTTOM TAB BAR (Stream view filter)
       ═══════════════════════════════════════════ -->
  <nav class="mobile-bottom-bar" id="bottom-bar">
    <button class="bottom-tab active" data-filter="all">
      <span class="bottom-tab-icon">🏠</span>
      <span class="bottom-tab-label">All</span>
    </button>
    <button class="bottom-tab" data-filter="openclaw">
      <span class="bottom-tab-icon">🐾</span>
      <span class="bottom-tab-label">OpenClaw</span>
    </button>
    <button class="bottom-tab" data-filter="ai">
      <span class="bottom-tab-icon">🤖</span>
      <span class="bottom-tab-label">AI</span>
    </button>
    <button class="bottom-tab" data-filter="system">
      <span class="bottom-tab-icon">💻</span>
      <span class="bottom-tab-label">System</span>
    </button>
  </nav>

  <!-- ═══════════════════════════════════════════
       FULLSCREEN WIDGET OVERLAY
       ═══════════════════════════════════════════ -->
  <div class="mobile-fullscreen" id="fullscreen-overlay" style="display:none;">
    <div class="fullscreen-header">
      <span class="fullscreen-title" id="fullscreen-title"></span>
      <button class="mobile-icon-btn fullscreen-close" id="fullscreen-close">✕</button>
    </div>
    <div class="fullscreen-body" id="fullscreen-body"></div>
  </div>

  <!-- ═══════════════════════════════════════════
       PIN MODAL (reused from desktop)
       ═══════════════════════════════════════════ -->
  <div class="mobile-pin-modal" id="pin-modal" style="display:none;">
    <div class="pin-card">
      <h3>🔐 Enter PIN</h3>
      <input type="password" id="mobile-pin-input" class="pin-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="••••">
      <div class="pin-error" id="pin-error"></div>
      <button class="btn-primary pin-submit" id="mobile-pin-submit">Unlock</button>
    </div>
  </div>

  <!-- Load widget definitions (reused from desktop) -->
  <script src="js/widgets.js"></script>
  <!-- Mobile-specific logic -->
  <script src="js/mobile.js"></script>
</body>
</html>
